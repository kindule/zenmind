<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 812" role="img" aria-labelledby="ttp-svg-title ttp-svg-desc" font-family="system-ui, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="ttp-svg-title">TorchTitan 数据路径图：4D 并行（FSDP/HSDP、TP/SP、PP、CP）训练、DCP 异步检查点与 Flight Recorder</title>
  <desc id="ttp-svg-desc">流程方向为自上而下：控制面由 TOML 配置构建 DeviceMesh 并行维度、选择流水线调度并驱动通用训练循环；数据面上，C4 数据集经 tiktoken 分词与可检查点数据加载器进入训练，模型先在 meta 设备上完成分片初始化，随后 microbatch 按流水线调度流经各 PP 阶段，阶段之间仅以点对点方式传递边界激活与梯度；单个阶段内部嵌套 TP/SP 分片计算（节点内 NVLink，AsyncTP 重叠通信）、FSDP2 参数 all-gather 与梯度 reduce-scatter（跨节点 RDMA，HSDP 增加副本组 allreduce）以及 CP 序列维 Ring Attention；之后优化器以 FP32 更新；DCP 按 DTensor 布局分片保存检查点，异步模式以独立线程持久化并与训练迭代重叠，写入高吞吐存储；Flight Recorder 旁路记录所有集合与点对点通信事件用于故障诊断。实线为数据面，虚线为控制面与调试旁路；编号一至九对应正文数据路径步骤。</desc>
  <defs>
    <marker id="ttp-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ttp-arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="ttp-arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="812" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#14385c">TorchTitan：4D 并行训练数据路径与控制面</text>
  <text x="30" y="56" font-size="12" fill="#4b5563">方向：数据/配置 → 初始化 → 并行计算（TP/SP·FSDP2/HSDP·PP·CP）→ 优化器 → 检查点/存储　｜　依据论文第 4–7、14–21 页（arXiv:2410.06511v3）</text>

  <!-- 图例 -->
  <g font-size="11.5" fill="#374151">
    <rect x="30" y="70" width="14" height="14" fill="#e6f7fb" stroke="#0e7490" stroke-width="1.6"/>
    <text x="49" y="81">GPU 计算 / 张量流（实线）</text>
    <rect x="196" y="70" width="14" height="14" fill="#f3ecfd" stroke="#6d28d9" stroke-width="1.6"/>
    <text x="215" y="81">检查点 / 存储（紫）</text>
    <rect x="336" y="70" width="14" height="14" fill="#fdeada" stroke="#c2410c" stroke-width="1.6"/>
    <text x="355" y="81">网络通信（橙）</text>
    <rect x="470" y="70" width="14" height="14" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="489" y="81">控制面（蓝虚线）</text>
    <rect x="604" y="70" width="14" height="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="623" y="81">调试旁路（Flight Recorder）</text>
  </g>

  <!-- 控制面 -->
  <rect x="30" y="98" width="920" height="122" rx="8" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="44" y="120" font-size="13.5" font-weight="700" fill="#1f3a5f">控制面 Control Plane（配置 · 并行维度 · 调度 · 训练循环，虚线）</text>
  <rect x="50" y="134" width="200" height="68" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="150" y="156" font-size="12" text-anchor="middle" fill="#1f2937">TOML 配置 + 命令行覆盖</text>
  <text x="150" y="174" font-size="10.5" text-anchor="middle" fill="#374151">模型 / 并行度 / 优化器 / 检查点</text>
  <text x="150" y="190" font-size="10.5" text-anchor="middle" fill="#374151">（三组件正交：模型·并行化·循环）</text>
  <rect x="280" y="134" width="216" height="68" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="388" y="156" font-size="12" text-anchor="middle" fill="#1f2937">DeviceMesh 构建并行维度</text>
  <text x="388" y="174" font-size="10.5" text-anchor="middle" fill="#374151">FSDP/HSDP × TP/SP × PP × CP</text>
  <text x="388" y="190" font-size="10.5" text-anchor="middle" fill="#374151">DTensor 统一张量抽象 + 单设备语义</text>
  <rect x="526" y="134" width="216" height="68" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="634" y="156" font-size="12" text-anchor="middle" fill="#1f2937">流水线调度选择（共 6 种）</text>
  <text x="634" y="174" font-size="10.5" text-anchor="middle" fill="#374151">1F1B · 交错 1F1B · ZeroBubble</text>
  <text x="634" y="190" font-size="10.5" text-anchor="middle" fill="#374151">GPipe · Looped-BFS · 弹性交错 1F1B</text>
  <rect x="772" y="134" width="158" height="68" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="851" y="156" font-size="12" text-anchor="middle" fill="#1f2937">通用训练循环</text>
  <text x="851" y="174" font-size="10.5" text-anchor="middle" fill="#374151">执行调度而非直接 forward</text>
  <text x="851" y="190" font-size="10.5" text-anchor="middle" fill="#374151">共享 loss_fn 统一接口</text>

  <!-- 数据面 -->
  <rect x="30" y="234" width="920" height="516" rx="8" fill="#f2fbfd" stroke="#0e7490" stroke-width="1.8"/>
  <text x="44" y="256" font-size="13.5" font-weight="700" fill="#0e7490">数据面 Data Plane（数据 · 张量 · 通信 · 检查点，实线）</text>

  <!-- ① 数据接入 -->
  <rect x="50" y="272" width="270" height="60" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="62" y="292" font-size="12.5" font-weight="700" fill="#155e75">① 数据接入</text>
  <text x="62" y="309" font-size="10.5" fill="#374151">C4（en）语料 → tiktoken 分词（Llama 3.1）</text>
  <text x="62" y="324" font-size="10.5" fill="#374151">可检查点 data loader（断点续读）</text>

  <!-- ② 初始化 -->
  <rect x="360" y="272" width="570" height="60" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="372" y="292" font-size="12.5" font-weight="700" fill="#155e75">② meta device 初始化与并行应用（控制面指令 → 数据面落盘 GPU）</text>
  <text x="372" y="309" font-size="10.5" fill="#374151">meta 建模 → PP 切分点切 stage → 对每个 stage 依次应用 TP/AC/compile/FSDP2/混合精度</text>
  <text x="372" y="324" font-size="10.5" fill="#374151">to_empty(cuda) 落卡 + init_weights（DTensor 保证分片布局与 RNG 正确）</text>

  <line x1="320" y1="302" x2="354" y2="302" stroke="#334155" stroke-width="2.5" marker-end="url(#ttp-arr)"/>
  <line x1="645" y1="332" x2="645" y2="354" stroke="#334155" stroke-width="2.5" marker-end="url(#ttp-arr)"/>
  <text x="657" y="348" font-size="10.5" fill="#334155">microbatch 流</text>

  <!-- ③ 流水线 + 阶段内部 -->
  <rect x="50" y="356" width="660" height="212" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="62" y="377" font-size="12.5" font-weight="700" fill="#155e75">③ microbatch 沿流水线调度流动（气泡由调度与 microbatch 数决定）</text>
  <rect x="66" y="390" width="180" height="162" rx="5" fill="#fdeada" stroke="#c2410c" stroke-width="1.6"/>
  <text x="156" y="411" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7c2d12">PP 阶段间</text>
  <text x="78" y="432" font-size="10.5" fill="#7c2d12">仅传边界激活/梯度（P2P）</text>
  <text x="78" y="450" font-size="10.5" fill="#7c2d12">带宽需求远小于集合通信；</text>
  <text x="78" y="466" font-size="10.5" fill="#7c2d12">跨节点 RDMA 链路承载</text>
  <text x="78" y="487" font-size="10.5" fill="#7c2d12">注：PP 实验采用 ZeRO-2 语义</text>
  <text x="78" y="503" font-size="10.5" fill="#7c2d12">（ZeRO-3 每 microbatch 额外</text>
  <text x="78" y="519" font-size="10.5" fill="#7c2d12">all-gather，低效；第 20 页）</text>
  <text x="78" y="540" font-size="10.5" fill="#7c2d12">stage 0 → … → stage S−1</text>
  <text x="78" y="556" font-size="10.5" fill="#7c2d12">末 stage 算 loss 起反向</text>

  <rect x="262" y="390" width="432" height="162" rx="5" fill="#f2fbfd" stroke="#0e7490" stroke-dasharray="4 3"/>
  <text x="478" y="407" font-size="11" font-weight="700" text-anchor="middle" fill="#155e75">单个 PP 阶段内部（一组 GPU：TP×CP×FSDP 嵌套于该维）</text>
  <rect x="274" y="414" width="408" height="58" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
  <text x="284" y="431" font-size="11" font-weight="700" fill="#155e75">④ TP/SP 分片计算（节点内 NVLink/NVSwitch）</text>
  <text x="284" y="447" font-size="10.5" fill="#374151">attention·MLP 列/行分片（Rowwise/Colwise）；norm/dropout 序列分片</text>
  <text x="284" y="462" font-size="10.5" fill="#374151">AsyncTP 微流水重叠通信（SymmetricMemory，H100+）</text>
  <rect x="274" y="480" width="198" height="64" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
  <text x="284" y="497" font-size="11" font-weight="700" fill="#155e75">⑤ FSDP2 / HSDP（跨节点）</text>
  <text x="284" y="513" font-size="10.5" fill="#374151">参数 all-gather（BF16）</text>
  <text x="284" y="528" font-size="10.5" fill="#374151">梯度 reduce-scatter（FP32）</text>
  <text x="284" y="543" font-size="10.5" fill="#374151">HSDP：副本组间 allreduce</text>
  <rect x="484" y="480" width="198" height="64" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
  <text x="494" y="497" font-size="11" font-weight="700" fill="#155e75">⑥ CP 序列分片（长上下文）</text>
  <text x="494" y="513" font-size="10.5" fill="#374151">Ring Attention P2P 轮转</text>
  <text x="494" y="528" font-size="10.5" fill="#374151">因果负载均衡；上下文至 262,144</text>
  <text x="494" y="543" font-size="10.5" fill="#374151">TP 居最内维、CP 居次外维</text>

  <!-- ⑨ Flight Recorder 旁路 -->
  <rect x="740" y="356" width="210" height="96" rx="6" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="752" y="377" font-size="12.5" font-weight="700" fill="#374151">⑨ Flight Recorder（旁路）</text>
  <text x="752" y="395" font-size="10.5" fill="#4b5563">记录集合/P2P 通信的起止与</text>
  <text x="752" y="410" font-size="10.5" fill="#4b5563">入队时间、进程组、rank、</text>
  <text x="752" y="425" font-size="10.5" fill="#4b5563">张量尺寸、调用栈；定位卡死</text>
  <text x="752" y="440" font-size="10.5" fill="#4b5563">与未调用 collective 的 rank</text>
  <line x1="710" y1="404" x2="734" y2="404" stroke="#4b5563" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- 通信基座 -->
  <rect x="740" y="470" width="210" height="98" rx="6" fill="#fdeada" stroke="#c2410c" stroke-width="1.8"/>
  <text x="752" y="491" font-size="12" font-weight="700" fill="#7c2d12">通信基座（网络分层）</text>
  <text x="752" y="509" font-size="10.5" fill="#7c2d12">节点内 NVLink/NVSwitch：</text>
  <text x="752" y="524" font-size="10.5" fill="#7c2d12">TP/SP、AsyncTP（度数一般 ≤8）</text>
  <text x="752" y="539" font-size="10.5" fill="#7c2d12">节点间 RDMA（TOR 互联）：</text>
  <text x="752" y="554" font-size="10.5" fill="#7c2d12">FSDP all-gather/reduce-scatter、PP P2P</text>

  <!-- ⑦ 优化器 -->
  <line x1="380" y1="568" x2="380" y2="590" stroke="#334155" stroke-width="2.5" marker-end="url(#ttp-arr)"/>
  <rect x="50" y="592" width="270" height="74" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="62" y="613" font-size="12.5" font-weight="700" fill="#155e75">⑦ 反向与优化器更新</text>
  <text x="62" y="631" font-size="10.5" fill="#374151">Loss Parallel：交叉熵按词元维分片，</text>
  <text x="62" y="646" font-size="10.5" fill="#374151">免全量 gather 输出（默认启用）</text>
  <text x="62" y="661" font-size="10.5" fill="#374151">优化器状态 FP32 更新</text>

  <!-- ⑧ DCP -->
  <rect x="360" y="592" width="380" height="74" rx="6" fill="#f3ecfd" stroke="#6d28d9" stroke-width="2"/>
  <text x="372" y="613" font-size="12.5" font-weight="700" fill="#4c1d95">⑧ DCP 分布式检查点（保存 / 恢复）</text>
  <text x="372" y="631" font-size="10.5" fill="#4c1d95">分片状态按 DTensor 布局读写，与并行方式解耦</text>
  <text x="372" y="646" font-size="10.5" fill="#4c1d95">异步模式：独立线程持久化，与训练迭代重叠</text>
  <text x="372" y="661" font-size="10.5" fill="#4c1d95">（Llama 3.1 8B 上开销较同步降 5–15×）</text>

  <!-- 存储 -->
  <line x1="550" y1="666" x2="550" y2="688" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#ttp-arr-purple)"/>
  <rect x="360" y="690" width="380" height="44" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="550" y="708" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">检查点存储：分片多对象并发写</text>
  <text x="550" y="724" font-size="10.5" text-anchor="middle" fill="#5b21b6">（云上映射为高吞吐对象存储 / 并行文件系统）</text>

  <text x="30" y="774" font-size="11" fill="#4b5563">图例编号 ①–⑨ 对应正文「数据路径」文字序列；平面划分、配色与编号为编辑标注（论文本身无此图）。依据论文第 4–7 页 §2.1–§2.3、第 14–21 页附录 A/B 绘制。</text>
  <text x="30" y="792" font-size="11" fill="#4b5563">关键事实核验：TOML 三组件（第 3 页）· FSDP2/HSDP（第 4、16–17 页）· TP/SP/Loss（第 4–5、17 页）· PP 六调度（第 5、20 页）· CP（第 5、18 页）· AC/SAC（第 5、18–19 页）· AsyncTP/Float8（第 6、19 页）· DCP 5–15×（第 7 页）· Flight Recorder（第 7 页）。</text>
</svg>
