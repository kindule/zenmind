<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" role="img" aria-labelledby="lk-svg-title lk-svg-desc" font-family="system-ui, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="lk-svg-title">Liger Kernel 数据路径图：Triton 融合算子在 HBM/SRAM 之间的单次读写、FusedLinearCrossEntropy 分块计算与集成接入路径</title>
  <desc id="lk-svg-desc">流程方向为自上而下：训练框架（HuggingFace Trainer、TRL SFTTrainer、Axolotl、LLaMA-Factory）经自动补丁 AutoLigerKernelForCausalLM 或模型专用补丁 API 接入，替换模型代码中的 RMSNorm、LayerNorm、RoPE、SwiGLU、GeGLU、CrossEntropy 算子；每个融合 Triton kernel 将张量整理为按行处理的两维矩阵，一次载入片上 SRAM 完成归一化、旋转或激活门控的正反向计算并缓存反向所需的中间量，避免对 HBM 的重复搬运；交叉熵路径上，FusedLinearCrossEntropy 将三维隐状态折叠为二维后分块送入线性投影头，逐块生成 logits 并交给带在线 softmax 的非融合 CE kernel 就地写出梯度，再回传块梯度累积投影头梯度，从而避免整张 logits 张量落显存；全部 kernel 与 FSDP、DeepSpeed ZeRO/ZeRO++ 等分布式框架兼容；右侧为正确性、性能、收敛与连续性四类测试闸门。实线为训练数据流，虚线为测试与旁路。</desc>
  <defs>
    <marker id="lk-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="lk-arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
    <marker id="lk-arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="820" fill="#ffffff"/>
  <text x="30" y="34" font-size="19" font-weight="700" fill="#14385c">Liger Kernel：融合 Triton 算子的训练数据路径</text>
  <text x="30" y="56" font-size="12" fill="#4b5563">方向：训练框架接入 → 算子替换 → 融合 kernel（HBM→SRAM 单次读写）→ FLCE 分块交叉熵 → 梯度回传　｜　依据论文第 1–10、13 页（arXiv:2410.10989v3）</text>

  <!-- 图例 -->
  <g font-size="11.5" fill="#374151">
    <rect x="30" y="70" width="14" height="14" fill="#e6f7fb" stroke="#0e7490" stroke-width="1.6"/>
    <text x="49" y="81">GPU 计算 / 张量流（实线）</text>
    <rect x="196" y="70" width="14" height="14" fill="#f3ecfd" stroke="#6d28d9" stroke-width="1.6"/>
    <text x="215" y="81">显存 / 存储对象（紫）</text>
    <rect x="346" y="70" width="14" height="14" fill="#fdeada" stroke="#c2410c" stroke-width="1.6"/>
    <text x="365" y="81">集成接入（橙）</text>
    <rect x="470" y="70" width="14" height="14" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="489" y="81">测试闸门（灰虚线）</text>
    <rect x="614" y="70" width="14" height="14" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.6"/>
    <text x="633" y="81">控制 / 配置面（蓝）</text>
  </g>

  <!-- 接入层 -->
  <rect x="30" y="98" width="920" height="96" rx="8" fill="#fdeada" stroke="#c2410c" stroke-width="1.8"/>
  <text x="44" y="120" font-size="13.5" font-weight="700" fill="#7c2d12">① 接入层：训练框架 → 算子替换（对用户代码扰动最小，第 3 页 §3.1）</text>
  <rect x="50" y="130" width="284" height="52" rx="5" fill="#ffffff" stroke="#c2410c"/>
  <text x="192" y="150" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7c2d12">路径 A 自动补丁：AutoLigerKernelForCausalLM</text>
  <text x="192" y="167" font-size="10.5" text-anchor="middle" fill="#7c2d12">模型类型受支持即自动改写 modeling 代码</text>
  <rect x="364" y="130" width="284" height="52" rx="5" fill="#ffffff" stroke="#c2410c"/>
  <text x="506" y="150" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7c2d12">路径 B 模型专用补丁：apply_liger_kernel_to_llama</text>
  <text x="506" y="167" font-size="10.5" text-anchor="middle" fill="#7c2d12">加载模型前细粒度替换，可扩展到序列分类等</text>
  <rect x="678" y="130" width="252" height="52" rx="5" fill="#ffffff" stroke="#c2410c"/>
  <text x="804" y="150" font-size="11.5" font-weight="700" text-anchor="middle" fill="#7c2d12">路径 C 自定义拼装：LigerLayerNorm 等单算子</text>
  <text x="804" y="167" font-size="10.5" text-anchor="middle" fill="#7c2d12">高级用户按需组合自建模型</text>
  <text x="44" y="188" font-size="10" fill="#7c2d12">已接入：HF transformers Trainer · HF TRL SFTTrainer（use_liger=True）· Axolotl · LLaMA-Factory（第 8 页 §3.4）；兼容 FSDP、DeepSpeed ZeRO/ZeRO++（第 1 页 §1）</text>

  <line x1="490" y1="194" x2="490" y2="216" stroke="#334155" stroke-width="2.5" marker-end="url(#lk-arr)"/>

  <!-- 融合算子层 -->
  <rect x="30" y="218" width="640" height="252" rx="8" fill="#f2fbfd" stroke="#0e7490" stroke-width="1.8"/>
  <text x="44" y="240" font-size="13.5" font-weight="700" fill="#0e7490">② 融合 Triton 算子层（输入/输出整理为 (B×T, H) 二维、按行并行，第 4 页 §3.2）</text>

  <rect x="50" y="252" width="290" height="70" rx="5" fill="#ffffff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="62" y="270" font-size="11.5" font-weight="700" fill="#155e75">RMSNorm / LayerNorm（第 4 页）</text>
  <text x="62" y="286" font-size="10.5" fill="#374151">归一化 + 缩放融合为单 kernel；缓存标量供反向复用</text>
  <text x="62" y="301" font-size="10.5" fill="#374151">RMS（RMSNorm）/ inverse RMS（LayerNorm）</text>
  <text x="62" y="316" font-size="10.5" fill="#374151">省重复搬运与浮点运算；γ/β 梯度需按 batch 累加</text>

  <rect x="360" y="252" width="290" height="70" rx="5" fill="#ffffff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="372" y="270" font-size="11.5" font-weight="700" fill="#155e75">RoPE（第 5 页）</text>
  <text x="372" y="286" font-size="10.5" fill="#374151">query/key 旋转位置编码融合为单 kernel</text>
  <text x="372" y="301" font-size="10.5" fill="#374151">旋转矩阵按 HF 实现形式；一维扁平存储</text>
  <text x="372" y="316" font-size="10.5" fill="#374151">利用稀疏重复块抑制时延随维度增长</text>

  <rect x="50" y="330" width="290" height="70" rx="5" fill="#ffffff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="62" y="348" font-size="11.5" font-weight="700" fill="#155e75">SwiGLU（第 5 页）/ GeGLU（第 6 页）</text>
  <text x="62" y="364" font-size="10.5" fill="#374151">逐元素门控融合为单 kernel（SiLU/GELU-tanh）</text>
  <text x="62" y="379" font-size="10.5" fill="#374151">反向重算 SiLU/GELU 输出换显存（峰值约降 1.6×）</text>
  <text x="62" y="394" font-size="10.5" fill="#374151">速度与基线持平（第 9 页 §4.1）</text>

  <rect x="360" y="330" width="290" height="70" rx="5" fill="#ffffff" stroke="#0e7490" stroke-width="1.8"/>
  <text x="372" y="348" font-size="11.5" font-weight="700" fill="#155e75">非融合 CrossEntropy（第 6 页）</text>
  <text x="372" y="364" font-size="10.5" fill="#374151">梯度计算前移 + logits 就地替换</text>
  <text x="372" y="379" font-size="10.5" fill="#374151">在线 softmax 流式计算；safe log 保数值稳定</text>
  <text x="372" y="394" font-size="10.5" fill="#374151">仍需整张 logits 驻留显存 → 引出 FLCE</text>

  <rect x="50" y="408" width="600" height="50" rx="5" fill="#e6f7fb" stroke="#0e7490" stroke-dasharray="4 3"/>
  <text x="62" y="428" font-size="11" font-weight="700" fill="#155e75">HBM ↔ SRAM 瓶颈（第 2 页 §2.2）：融合的目标是减少 HBM 往返</text>
  <text x="62" y="444" font-size="10.5" fill="#374151">分块放入片上 SRAM 完成“读一次、算完、写一次”；借鉴 Unsloth / FlashAttention / EfficientCrossEntropy（第 2–3 页）</text>

  <!-- FLCE 层 -->
  <line x1="350" y1="470" x2="350" y2="492" stroke="#334155" stroke-width="2.5" marker-end="url(#lk-arr)"/>
  <text x="362" y="488" font-size="10.5" fill="#334155">大词表场景（CE 仍是瓶颈）</text>

  <rect x="30" y="494" width="640" height="180" rx="8" fill="#f3ecfd" stroke="#6d28d9" stroke-width="2"/>
  <text x="44" y="516" font-size="13.5" font-weight="700" fill="#4c1d95">③ FusedLinearCrossEntropy：分块 logits 消费（第 7 页图 1，避免整张 logits 落显存）</text>
  <text x="44" y="533" font-size="10.5" fill="#4c1d95">动机示例（第 6 页）：Gemma 单卡、batch 8、序列 4096、词表 256k、bfloat16 ⇒ 仅 logits 即 16.8 GB</text>

  <rect x="50" y="544" width="140" height="64" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="120" y="563" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">三维隐状态</text>
  <text x="120" y="579" font-size="10" text-anchor="middle" fill="#4c1d95">(B,S,H) 折叠为</text>
  <text x="120" y="594" font-size="10" text-anchor="middle" fill="#4c1d95">(B×T, H) 二维</text>
  <rect x="230" y="544" width="140" height="64" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="300" y="563" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">线性投影头（分块）</text>
  <text x="300" y="579" font-size="10" text-anchor="middle" fill="#4c1d95">x = Wᵀh 逐块生成</text>
  <text x="300" y="593" font-size="9.2" text-anchor="middle" fill="#4c1d95">chunk=2^⌈log₂⌈BT/⌈V/H⌉⌉⌉</text>
  <rect x="410" y="544" width="120" height="64" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="470" y="563" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">块 logits</text>
  <text x="470" y="579" font-size="10" text-anchor="middle" fill="#4c1d95">仅在块内存在</text>
  <text x="470" y="594" font-size="10" text-anchor="middle" fill="#4c1d95">不整张物化</text>
  <rect x="560" y="544" width="90" height="64" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="605" y="563" font-size="11" font-weight="700" text-anchor="middle" fill="#4c1d95">部分损失</text>
  <text x="605" y="579" font-size="10" text-anchor="middle" fill="#4c1d95">非融合 CE</text>
  <text x="605" y="594" font-size="10" text-anchor="middle" fill="#4c1d95">+ 在线 softmax</text>

  <line x1="190" y1="576" x2="224" y2="576" stroke="#334155" stroke-width="2.2" marker-end="url(#lk-arr)"/>
  <line x1="370" y1="576" x2="404" y2="576" stroke="#334155" stroke-width="2.2" marker-end="url(#lk-arr)"/>
  <line x1="530" y1="576" x2="554" y2="576" stroke="#334155" stroke-width="2.2" marker-end="url(#lk-arr)"/>

  <rect x="50" y="614" width="600" height="54" rx="5" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="62" y="630" font-size="10.5" font-weight="700" fill="#4c1d95">回传路径：块 logits 梯度 → 块隐状态梯度 + 累积投影头梯度</text>
  <text x="62" y="645" font-size="10.5" font-weight="700" fill="#4c1d95">∇W = Σ h·(∇x)⊤；按 chunk_size/(B×T) 比例补缩放（第 7 页 Remark）</text>
  <text x="62" y="660" font-size="10.5" fill="#4c1d95">效果（第 9 页 §4.1）：词表 163840 时 CE 路径约 3× 提速、约 5× 省显存（单卡 A100 80GB）</text>

  <!-- 显存对象 -->
  <line x1="650" y1="308" x2="694" y2="308" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#lk-arr-purple)"/>
  <line x1="650" y1="584" x2="694" y2="584" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#lk-arr-purple)"/>
  <rect x="700" y="218" width="250" height="252" rx="8" fill="#f3ecfd" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="712" y="240" font-size="13" font-weight="700" fill="#4c1d95">HBM 显存占用视角</text>
  <rect x="714" y="252" width="222" height="44" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="825" y="270" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4c1d95">非融合基线：整张 logits 张量</text>
  <text x="825" y="286" font-size="10" text-anchor="middle" fill="#4c1d95">前向峰值常出现在激活释放前（脚注 10）</text>
  <rect x="714" y="306" width="222" height="44" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="825" y="324" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4c1d95">CE kernel：logits 与梯度就地互换</text>
  <text x="825" y="340" font-size="10" text-anchor="middle" fill="#4c1d95">避免双份大张量共存（第 6 页）</text>
  <rect x="714" y="360" width="222" height="44" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="825" y="378" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4c1d95">FLCE：仅块级 logits 驻留</text>
  <text x="825" y="394" font-size="10" text-anchor="middle" fill="#4c1d95">省出显存换更大 batch / 更长序列</text>
  <rect x="714" y="414" width="222" height="44" rx="4" fill="#ffffff" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="825" y="432" font-size="10.5" font-weight="700" text-anchor="middle" fill="#4c1d95">Medusa 多头场景（第 13 页）</text>
  <text x="825" y="448" font-size="10" text-anchor="middle" fill="#4c1d95">逐头 logits 免物化，缓解多解码头 OOM</text>

  <!-- 分布式兼容 -->
  <line x1="490" y1="674" x2="490" y2="696" stroke="#334155" stroke-width="2.5" marker-end="url(#lk-arr)"/>
  <rect x="30" y="698" width="450" height="76" rx="8" fill="#e6f7fb" stroke="#0e7490" stroke-width="1.8"/>
  <text x="44" y="719" font-size="12.5" font-weight="700" fill="#155e75">④ 分布式训练兼容（第 1 页 §1）</text>
  <text x="44" y="736" font-size="10.5" fill="#374151">kernel 级替换与并行策略正交：PyTorch FSDP、DeepSpeed ZeRO、</text>
  <text x="44" y="751" font-size="10.5" fill="#374151">ZeRO++ 均可直接叠加；基准脚本随仓库发布（第 10 页脚注 18）</text>
  <text x="44" y="766" font-size="10.5" fill="#374151">评测口径（§4.2）：4×A100 80GB、bfloat16、AdamW+cosine、Alpaca、序列 512</text>

  <!-- 测试闸门 -->
  <rect x="500" y="698" width="450" height="76" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="514" y="719" font-size="12.5" font-weight="700" fill="#374151">⑤ 测试闸门：Exactness is non-negotiable（第 7 页 §3.3）</text>
  <text x="514" y="736" font-size="10.5" fill="#4b5563">正确性：vs 纯 PyTorch/HF 基线；fp32 atol 1e-7/rtol 1e-5，bf16 atol 1e-3/rtol 1e-2</text>
  <text x="514" y="751" font-size="10.5" fill="#4b5563">int32 program id 溢出（&gt;2,147,483,647 变负）→ 大维度转 int64；非连续张量可致非法访问</text>
  <text x="514" y="766" font-size="10.5" fill="#4b5563">性能 + 收敛 + 连续性：生产 RoPE 曾因 SDPA 导数非连续而 loss 发散（第 8 页 §3.3.4）</text>

  <text x="30" y="790" font-size="11" fill="#4b5563">图中编号 ①–⑤ 为图内分层序号，对应页面「数据路径」一节文字序列 ①–⑥ 中的：图①＝文①、图②＝文②–③、图③＝文④、图④＝文⑤、图⑤＝文⑥。</text>
  <text x="30" y="808" font-size="11" fill="#4b5563">分层与配色为编辑标注（论文本身无此图）。依据论文第 1–10、13 页 §1–§4 绘制；全部性能数字的条件见页面「实验与指标」一节。</text>
</svg>
