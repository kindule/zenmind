<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" role="img" aria-labelledby="dsp-svg-title dsp-svg-desc" font-family="system-ui, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="dsp-svg-title">DistServe 数据路径图：prefill 与 decode 分离的控制面与数据面</title>
  <desc id="dsp-svg-desc">流程方向为：客户端提交请求，经控制面（RESTful API 前端、FCFS 集中控制器、编排层、placement 算法模块与模拟器、workload profiler）决策与派发；数据面上，Prefill 实例在 GPU 上对整段 prompt 做预填计算并暂存 KV Cache，Decoding 实例通过拉取方式取得 KV Cache 后逐 token 解码，结果流式返回客户端；模型权重由存储为每个实例各加载一份；负载画像触发重规划。实线表示数据面流，虚线表示控制面流；编号一至八对应正文数据路径步骤。</desc>
  <defs>
    <marker id="dsp-arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="dsp-arr-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="dsp-arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="690" fill="#ffffff"/>
  <text x="30" y="36" font-size="19" font-weight="700" fill="#14385c">DistServe：prefill / decode 分离的数据路径与控制面</text>
  <text x="30" y="58" font-size="12" fill="#4b5563">方向：客户端 → 调度/服务 → GPU/互联 → 内存/存储　｜　依据论文第 8 页图 6 与 §4–§5（arXiv:2401.09670v3）</text>

  <!-- 控制面 -->
  <rect x="240" y="74" width="720" height="168" rx="8" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="254" y="97" font-size="14" font-weight="700" fill="#1f3a5f">控制面 Control Plane（编排 · 决策 · 监控，虚线）</text>
  <rect x="258" y="108" width="196" height="52" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="356" y="129" font-size="12.5" text-anchor="middle" fill="#1f2937">RESTful API 前端</text>
  <text x="356" y="147" font-size="11.5" text-anchor="middle" fill="#374151">（OpenAI 兼容接口）</text>
  <rect x="474" y="108" width="210" height="52" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="579" y="129" font-size="12.5" text-anchor="middle" fill="#1f2937">集中控制器（FCFS）</text>
  <text x="579" y="147" font-size="11.5" text-anchor="middle" fill="#374151">最短队列派发预填任务</text>
  <rect x="704" y="108" width="240" height="52" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="824" y="129" font-size="12.5" text-anchor="middle" fill="#1f2937">编排层</text>
  <text x="824" y="147" font-size="11.5" text-anchor="middle" fill="#374151">实例管理 · KV 传输调度 · 结果回传</text>
  <rect x="258" y="172" width="300" height="56" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="408" y="194" font-size="12.5" text-anchor="middle" fill="#1f2937">placement 算法模块 + 模拟器</text>
  <text x="408" y="213" font-size="11.5" text-anchor="middle" fill="#374151">Alg.1 高节点亲和 ｜ Alg.2 低节点亲和</text>
  <rect x="578" y="172" width="210" height="56" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="683" y="194" font-size="12.5" text-anchor="middle" fill="#1f2937">workload profiler</text>
  <text x="683" y="213" font-size="11.5" text-anchor="middle" fill="#374151">输入/输出长度 · 到达率画像</text>
  <rect x="808" y="172" width="136" height="56" rx="5" fill="#ffffff" stroke="#1f3a5f"/>
  <text x="876" y="194" font-size="12.5" text-anchor="middle" fill="#1f2937">复制扩容</text>
  <text x="876" y="213" font-size="11.5" text-anchor="middle" fill="#374151">n = ⌈R / goodput⌉</text>

  <!-- 数据面 -->
  <rect x="240" y="268" width="720" height="252" rx="8" fill="#f2fbfd" stroke="#0e7490" stroke-width="1.8"/>
  <text x="254" y="291" font-size="14" font-weight="700" fill="#0e7490">数据面 Data Plane（请求 · KV Cache · token，实线）</text>

  <!-- Prefill 实例 -->
  <rect x="258" y="306" width="264" height="196" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="390" y="327" font-size="13.5" font-weight="700" text-anchor="middle" fill="#155e75">③ Prefill 实例（GPU × N）</text>
  <rect x="272" y="338" width="236" height="40" rx="4" fill="#f3ecfd" stroke="#6d28d9"/>
  <text x="390" y="355" font-size="11.5" text-anchor="middle" fill="#4c1d95">LLM 权重完整副本</text>
  <text x="390" y="371" font-size="11" text-anchor="middle" fill="#5b21b6">（每实例独享一份，FP16 实验口径）</text>
  <rect x="272" y="386" width="236" height="50" rx="4" fill="#e6f7fb" stroke="#0e7490"/>
  <text x="390" y="406" font-size="11.5" text-anchor="middle" fill="#155e75">预填：整段 prompt 并行计算</text>
  <text x="390" y="424" font-size="11" text-anchor="middle" fill="#0e7490">（算力受限，HBM→SRAM 访存密集）</text>
  <rect x="272" y="444" width="236" height="44" rx="4" fill="#f3ecfd" stroke="#6d28d9"/>
  <text x="390" y="462" font-size="11.5" text-anchor="middle" fill="#4c1d95">KV Cache 暂存（HBM）</text>
  <text x="390" y="479" font-size="11" text-anchor="middle" fill="#5b21b6">作为 KV 拉取的排队缓冲</text>

  <!-- Decoding 实例 -->
  <rect x="664" y="306" width="280" height="196" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="2"/>
  <text x="804" y="327" font-size="13.5" font-weight="700" text-anchor="middle" fill="#155e75">⑤ Decoding 实例（GPU × M）</text>
  <rect x="678" y="338" width="252" height="40" rx="4" fill="#f3ecfd" stroke="#6d28d9"/>
  <text x="804" y="355" font-size="11.5" text-anchor="middle" fill="#4c1d95">LLM 权重完整副本</text>
  <text x="804" y="371" font-size="11" text-anchor="middle" fill="#5b21b6">（每实例独享一份，FP16 实验口径）</text>
  <rect x="678" y="386" width="252" height="50" rx="4" fill="#e6f7fb" stroke="#0e7490"/>
  <text x="804" y="406" font-size="11.5" text-anchor="middle" fill="#155e75">逐 token 自回归解码</text>
  <text x="804" y="424" font-size="11" text-anchor="middle" fill="#0e7490">（显存带宽受限 · continuous batching）</text>
  <rect x="678" y="444" width="252" height="44" rx="4" fill="#f3ecfd" stroke="#6d28d9"/>
  <text x="804" y="462" font-size="11.5" text-anchor="middle" fill="#4c1d95">KV Cache 逐步追加（HBM）</text>
  <text x="804" y="479" font-size="11" text-anchor="middle" fill="#5b21b6">批量受显存容量约束</text>

  <!-- KV 传输箭头与标注 -->
  <line x1="526" y1="430" x2="658" y2="430" stroke="#c2410c" stroke-width="3" marker-end="url(#dsp-arr-orange)"/>
  <text x="593" y="384" font-size="12" font-weight="700" text-anchor="middle" fill="#7c2d12">④ KV Cache 拉取</text>
  <text x="593" y="401" font-size="11" text-anchor="middle" fill="#9a3412">（pull，按需取走）</text>
  <text x="593" y="452" font-size="10.5" text-anchor="middle" fill="#9a3412">NVLink ≈600 GB/s</text>
  <text x="593" y="467" font-size="10.5" text-anchor="middle" fill="#9a3412">跨节点走 NCCL</text>
  <text x="593" y="482" font-size="10.5" text-anchor="middle" fill="#9a3412">512 tok@66B≈1.13 GB</text>

  <!-- 客户端 -->
  <rect x="30" y="330" width="170" height="120" rx="6" fill="#1f3a5f"/>
  <text x="115" y="372" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">客户端</text>
  <text x="115" y="396" font-size="12" text-anchor="middle" fill="#d7e3f4">提交 prompt 请求</text>
  <text x="115" y="414" font-size="12" text-anchor="middle" fill="#d7e3f4">接收流式 token</text>

  <!-- 箭头 ① 请求 -->
  <line x1="202" y1="356" x2="254" y2="140" stroke="#334155" stroke-width="2" marker-end="url(#dsp-arr-blue)"/>
  <text x="168" y="252" font-size="12" fill="#1f3a5f">① 请求</text>

  <!-- 箭头 ② 派发 -->
  <line x1="579" y1="162" x2="394" y2="302" stroke="#334155" stroke-width="2" marker-end="url(#dsp-arr-blue)"/>
  <text x="430" y="238" font-size="12" fill="#1f3a5f">② FCFS 派发</text>

  <!-- 虚线：策略下发 -->
  <line x1="408" y1="230" x2="396" y2="302" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="246" y="264" font-size="11" fill="#1f3a5f">并行策略与放置下发</text>

  <!-- 虚线 ⑧ 重规划 -->
  <line x1="683" y1="230" x2="758" y2="302" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dsp-arr-blue)"/>
  <text x="700" y="252" font-size="11" fill="#1f3a5f">⑧ 负载画像 / 触发重规划</text>

  <!-- 箭头 ⑥ 流式返回 -->
  <polyline points="900,502 900,514 115,514 115,452" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#dsp-arr-blue)"/>
  <text x="430" y="510" font-size="12" fill="#0e7490">⑥ 流式 token 返回</text>

  <!-- 权重存储 -->
  <rect x="258" y="548" width="560" height="46" rx="6" fill="#f3ecfd" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="538" y="568" font-size="12" text-anchor="middle" fill="#4c1d95">模型权重文件（对象存储 / 共享文件系统，云上映射见正文）</text>
  <text x="538" y="586" font-size="11.5" text-anchor="middle" fill="#5b21b6">⑦ 每个实例启动时加载一次（各实例独享副本）</text>
  <line x1="350" y1="548" x2="350" y2="506" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dsp-arr-purple)"/>
  <line x1="760" y1="548" x2="760" y2="506" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dsp-arr-purple)"/>

  <!-- 图例 -->
  <line x1="30" y1="618" x2="70" y2="618" stroke="#334155" stroke-width="2" marker-end="url(#dsp-arr-blue)"/>
  <text x="78" y="622" font-size="12" fill="#374151">实线：数据面（请求 / KV Cache / token 流）</text>
  <line x1="330" y1="618" x2="370" y2="618" stroke="#1f3a5f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="378" y="622" font-size="12" fill="#374151">虚线：控制面（策略 / 监控 / 加载指令）</text>
  <rect x="30" y="636" width="14" height="14" fill="#e6f7fb" stroke="#0e7490"/>
  <text x="50" y="647" font-size="12" fill="#374151">青＝GPU 计算</text>
  <rect x="150" y="636" width="14" height="14" fill="#f3ecfd" stroke="#6d28d9"/>
  <text x="170" y="647" font-size="12" fill="#374151">紫＝显存 / KV Cache</text>
  <rect x="320" y="636" width="14" height="14" fill="#fdeada" stroke="#c2410c"/>
  <text x="340" y="647" font-size="12" fill="#374151">橙＝网络传输</text>
  <rect x="440" y="636" width="14" height="14" fill="#1f3a5f"/>
  <text x="460" y="647" font-size="12" fill="#374151">蓝＝控制 / 客户端</text>
  <text x="570" y="647" font-size="12" fill="#374151">编号 ①–⑧ 对应正文数据路径步骤</text>

  <text x="30" y="674" font-size="11" fill="#6b7280">来源：DistServe 论文（arXiv:2401.09670v3）第 8 页图 6 与 §4–§5；带宽与 KV Cache 尺寸引自第 6 页 §3.3；实现栈引自第 9 页 §5。核验日期 2026-09-14。</text>
</svg>
