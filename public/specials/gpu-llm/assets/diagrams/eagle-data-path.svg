    <ellipse cx="62"  cy="750" rx="18" ry="10"/>
    <ellipse cx="108" cy="750" rx="18" ry="10"/>
    <ellipse cx="150" cy="750" rx="18" ry="10"/>
    <ellipse cx="196" cy="750" rx="18" ry="10"/>
    <ellipse cx="240" cy="750" rx="18" ry="10"/>
  </g>
  <g stroke="#0e7490" stroke-width="1.2">
    <line x1="140" y1="710" x2="98" y2="717"/>
    <line x1="150" y1="712" x2="150" y2="715"/>
    <line x1="160" y1="710" x2="204" y2="717"/>
    <line x1="170" y1="708" x2="246" y2="717"/>
    <line x1="82"  y1="735" x2="66" y2="741"/>
    <line x1="100" y1="735" x2="108" y2="741"/>
    <line x1="146" y1="737" x2="150" y2="741"/>
    <line x1="204" y1="736" x2="196" y2="741"/>
    <line x1="244" y1="736" x2="240" y2="741"/>
  </g>
  <text x="150" y="703" font-size="9.5" text-anchor="middle" fill="#155e75">已确认</text>
  <text x="290" y="700" font-size="10.5" fill="#374151">每条候选路径携带自己的 token 序列；高概率分支更深更宽</text>
  <text x="290" y="716" font-size="10.5" fill="#374151">（论文自述树结构凭直觉、未精调；全部实验用同一棵，p.12 附录 A.1）</text>
  <text x="290" y="732" font-size="10.5" fill="#374151">图 6 示例：3 次前向得 10-token 树；正文口径：草稿固定 5 次前向，</text>
  <text x="290" y="748" font-size="10.5" fill="#374151">验证不论树/链都只需目标模型一次前向。左侧拓扑为编辑示意。</text>
  <text x="290" y="762" font-size="10.5" fill="#475569">不用树时退化为链式草稿（消融口径），仍有约 2.3x–2.7x 加速（p.7）</text>

  <line x1="340" y1="770" x2="340" y2="792" stroke="#334155" stroke-width="2.5" marker-end="url(#egl-arr)"/>

  <!-- ⑥ 目标模型验证 -->
  <rect x="50" y="796" width="580" height="120" rx="6" fill="#ffffff" stroke="#1f3a5f" stroke-width="2"/>
  <text x="62" y="818" font-size="12.5" font-weight="700" fill="#1f3a5f">⑥ 目标模型验证：树注意力一次前向 + 多轮投机采样（无损）</text>
  <rect x="66" y="830" width="238" height="40" rx="4" fill="#eef3fa" stroke="#1f3a5f" stroke-width="1.4"/>
  <text x="185" y="847" font-size="10.5" text-anchor="middle" fill="#1f3a5f">树注意力掩码下一次前向</text>
  <text x="185" y="862" font-size="10" text-anchor="middle" fill="#1f3a5f">得到整棵树每个 token 的目标概率 p</text>
  <line x1="304" y1="850" x2="330" y2="850" stroke="#334155" stroke-width="2" marker-end="url(#egl-arr)"/>
  <rect x="334" y="830" width="280" height="40" rx="4" fill="#ffffff" stroke="#0e7490" stroke-width="1.4"/>
  <text x="474" y="847" font-size="10.5" text-anchor="middle" fill="#155e75">多轮投机采样（逐节点递归，与 SpecInfer 一致）</text>
  <text x="474" y="862" font-size="10" text-anchor="middle" fill="#155e75">r &lt; p/p̂ 接受；否则 p←norm(max(0,p−p̂)) 换下一候选</text>
  <text x="66" y="892" font-size="10.5" fill="#374151">全部候选被拒绝才从调整后分布采样一步；被接受 token 及其目标特征记录下来供下一轮草稿使用；</text>
  <text x="66" y="908" font-size="10.5" fill="#374151">输出分布与目标模型严格一致——贪心与非贪心均有理论保证，无需修改目标模型或接受判据（p.5 §3.3、p.12–13）</text>

  <line x1="340" y1="916" x2="340" y2="938" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#egl-arr-purple)"/>

  <!-- ⑦ 并回上下文 -->
  <rect x="50" y="942" width="580" height="52" rx="6" fill="#f3ecfd" stroke="#6d28d9" stroke-width="2"/>
  <text x="62" y="963" font-size="12.5" font-weight="700" fill="#5b21b6">⑦ 接受的 token + 其目标特征 并回上下文（KV 与特征序列同步追加）</text>
  <text x="62" y="981" font-size="10.5" fill="#374151">回到 ③/④ 进入下一轮草稿-验证循环；退出循环即输出最终文本（分布与目标模型一致）</text>

  <!-- 闭环箭头（左缘向上） -->
  <path d="M 50 968 L 34 968 L 34 380 L 46 380" fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#egl-arr-purple)"/>
  <text x="20" y="700" font-size="10.5" fill="#6d28d9" transform="rotate(-90 20 700)">下一轮解码循环</text>

  <!-- 右侧面板 S1 训练形态 -->
  <rect x="650" y="100" width="300" height="228" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="662" y="122" font-size="12.5" font-weight="700" fill="#475569">S1 训练形态（目标模型全程冻结）</text>
  <text x="662" y="142" font-size="10.5" fill="#374151">损失 = SmoothL1 特征回归 + 0.1×交叉熵分类</text>
  <text x="662" y="158" font-size="10.5" fill="#374151">（分类项数值约大一个量级，权重取 0.1，p.4–5）</text>
  <text x="662" y="174" font-size="10.5" fill="#374151">训练时对目标特征加 U(−0.1, 0.1) 噪声抗误差累积</text>
  <text x="662" y="190" font-size="10.5" fill="#374151">数据：ShareGPT 固定数据集 68,000 对话；lr 3e-5；</text>
  <text x="662" y="206" font-size="10.5" fill="#374151">AdamW(0.9, 0.95)；梯度裁剪 0.5（p.5 §3.3）</text>
  <text x="662" y="222" font-size="10.5" fill="#374151">可训练参数：0.24 / 0.37 / 0.56 / 0.99 B</text>
  <text x="662" y="238" font-size="10.5" fill="#374151">（7B / 13B / 33B / 70B），Mixtral 0.28B</text>
  <text x="662" y="254" font-size="10.5" fill="#374151">耗时 1–2 天：70B 用 4×A100 40G；</text>
  <text x="662" y="270" font-size="10.5" fill="#374151">7B/13B/33B 可在 RTX 3090 节点完成（p.3 §1）</text>
  <text x="662" y="286" font-size="10.5" fill="#374151">数据消融：目标模型自生成答案仅 2.88x vs 固定集</text>
  <text x="662" y="302" font-size="10.5" fill="#374151">2.78x（LC7B MT-bench T=0，表 6）→ 对数据不敏感</text>
  <text x="662" y="318" font-size="10.5" fill="#475569">Embedding / LM Head 复用目标参数不训练（❄）</text>

  <!-- 右侧面板 S2 硬件口径 -->
  <rect x="650" y="344" width="300" height="150" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="662" y="366" font-size="12.5" font-weight="700" fill="#475569">S2 评测硬件与口径</text>
  <text x="662" y="386" font-size="10.5" fill="#374151">以 batch=1 的墙钟延迟为主口径，FP16（p.5、p.8）</text>
  <text x="662" y="402" font-size="10.5" fill="#374151">显式披露：Vicuna 7B 单卡 RTX 3090（24G）；</text>
  <text x="662" y="418" font-size="10.5" fill="#374151">LLaMA2-Chat 70B 用 4×A100 40G（160G）</text>
  <text x="662" y="434" font-size="10.5" fill="#374151">其余型号推理硬件论文未披露（表 1/2 未复述）</text>
  <text x="662" y="450" font-size="10.5" fill="#374151">组合量化/编译：EAGLE+gpt-fast（LC7B，3090）</text>
  <text x="662" y="466" font-size="10.5" fill="#374151">FP16 100.2、int4 160.4 tokens/s（表 4，T=0）</text>
  <text x="662" y="482" font-size="10.5" fill="#475569">吞吐口径：bs=1 加速 2.90x，但吞吐倍数 1.97x</text>

  <!-- 右侧面板 S3 边界与风险 -->
  <rect x="650" y="510" width="300" height="224" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1.8"/>
  <text x="662" y="532" font-size="12.5" font-weight="700" fill="#92400e">S3 边界与风险（全部数字带条件）</text>
  <text x="662" y="552" font-size="10.5" fill="#78350f">batch 增大加速比衰减：V7B 2.90x(1)→2.87x(2)→</text>
  <text x="662" y="568" font-size="10.5" fill="#78350f">2.65x(3)→2.76x(4)；LC70B 3.01x→2.40x（表 7）</text>
  <text x="662" y="584" font-size="10.5" fill="#78350f">吞吐收益约 2x：V7B 1.97x / LC70B 1.99x</text>
  <text x="662" y="600" font-size="10.5" fill="#78350f">显存略增：最大 bs 8→7（24G）、5→4（160G）</text>
  <text x="662" y="616" font-size="10.5" fill="#78350f">MoE 受限：Mixtral 8x7B 仅 1.50x（验证或需读</text>
  <text x="662" y="632" font-size="10.5" fill="#78350f">两个以上专家权重，表 3）</text>
  <text x="662" y="648" font-size="10.5" fill="#78350f">树增益 ≠ 加速比增益：τ +0.6–0.8 仅换来</text>
  <text x="662" y="664" font-size="10.5" fill="#78350f">加速 +0.3–0.5（每前向 token 变多，p.7）</text>
  <text x="662" y="680" font-size="10.5" fill="#78350f">计算紧张时（如 bs=7）可关闭树注意力换吞吐</text>
  <text x="662" y="696" font-size="10.5" fill="#78350f">每目标模型需单独训练草稿头（一次训练摊销）</text>
  <text x="662" y="712" font-size="10.5" fill="#78350f">温度 1 加速低于温度 0（LC13B 2.66–2.89x vs</text>
  <text x="662" y="728" font-size="10.5" fill="#78350f">3.01–3.76x，表 1）；论文未测服务框架集成</text>

  <!-- 右侧面板 S4 指标口径 -->
  <rect x="650" y="750" width="300" height="160" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1.6"/>
  <text x="662" y="772" font-size="12.5" font-weight="700" fill="#155e75">S4 指标口径（p.5 §4）</text>
  <text x="662" y="792" font-size="10.5" fill="#374151">墙钟加速比 = 相对逐 token 自回归解码的实测比值</text>
  <text x="662" y="808" font-size="10.5" fill="#374151">平均接受长度 τ = 目标模型每次前向被接受的 token 数</text>
  <text x="662" y="824" font-size="10.5" fill="#374151">（表 1–2 范围 3.2–4.5，对比逐 token 解码的 1）</text>
  <text x="662" y="840" font-size="10.5" fill="#374151">接受率 α 用链式草稿（无树）测量；n-α = 前 n 个</text>
  <text x="662" y="856" font-size="10.5" fill="#374151">特征预测有误时的接受率（0-α 最高，1-α 起缓慢下降）</text>
  <text x="662" y="872" font-size="10.5" fill="#374151">无损 = 输出分布与目标模型一致；论文因此不重复</text>
  <text x="662" y="888" font-size="10.5" fill="#374151">评测生成质量（p.5：「既无必要也无意义」）</text>
  <text x="662" y="904" font-size="10.5" fill="#475569">T=0（贪心）与 T=1（非贪心）口径不可混用</text>

  <!-- 底部来源行 -->
  <text x="30" y="1002" font-size="10.5" fill="#6b7280">依据：EAGLE 论文（arXiv:2401.15077v3，ICML 2024）p.1–13：图 3/5/6/9、表 1–7、算法 1、附录 A；图内 P 标注见页面证据台账；实线=数据流，虚线=控制流/训练配置；本图为编辑绘制，不含论文原图。</text>
</svg>
