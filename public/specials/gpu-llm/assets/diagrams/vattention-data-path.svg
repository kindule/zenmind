  <text x="496" y="174" font-size="13.5" font-weight="700" fill="#155e75">VIRTUAL — per-request KV cache: contiguous virtual address range</text>
  <circle cx="1146" cy="169" r="13" fill="#1d4ed8"/>
  <text x="1146" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>

  <rect x="496" y="190" width="76" height="52" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
  <rect x="576" y="190" width="76" height="52" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
  <rect x="656" y="190" width="76" height="52" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
