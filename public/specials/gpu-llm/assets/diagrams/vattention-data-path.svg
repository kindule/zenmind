  <rect x="688" y="534" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="752" y="534" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="780" y="567" text-anchor="middle" font-size="11" fill="#94a3b8">free</text>
  <rect x="816" y="534" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="880" y="534" width="56" height="56" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="908" y="567" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">V4</text>
  <rect x="944" y="534" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="1008" y="534" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="1072" y="534" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Row 2 -->
  <rect x="496" y="598" width="56" height="56" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="524" y="631" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">V5</text>
  <rect x="560" y="598" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="624" y="598" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
