  <rect x="1072" y="598" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="1100" y="631" text-anchor="middle" font-size="11" fill="#94a3b8">free</text>

  <text x="825" y="676" text-anchor="middle" font-size="12" fill="#92400e">pages land wherever free — scattered, unordered; KV grows / shrinks token-by-token via map / unmap (§4)</text>

  <!-- ============ Legend ============ -->
  <rect x="480" y="706" width="690" height="92" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="496" y="724" font-size="12" font-weight="700" fill="#0f172a">Legend</text>

  <line x1="496" y1="740" x2="536" y2="740" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>
  <text x="546" y="744" font-size="12" fill="#334155">request / data flow (steps 1 → 7)</text>

  <line x1="496" y1="760" x2="536" y2="760" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <text x="546" y="764" font-size="12" fill="#334155">CUDA VMM map: virtual page → physical page</text>

  <circle cx="508" cy="782" r="10" fill="#1d4ed8"/>
  <text x="508" y="786" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="526" y="786" font-size="12" fill="#334155">numbered execution order (panel tags 3 · 4 · 5)</text>

  <rect x="880" y="731" width="16" height="16" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="904" y="744" font-size="12" fill="#334155">64 KB page mapped to this request</text>

  <rect x="880" y="753" width="16" height="16" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="904" y="766" font-size="12" fill="#334155">free / mapped to another request</text>

  <text x="880" y="786" font-size="12" fill="#64748b">V0–V7 labels tie physical pages to virtual slots</text>

  <!-- ============ Sources ============ -->
  <text x="60" y="830" font-size="12" fill="#64748b">Sources: vAttention paper PDF — p1 &amp; §1: motivation (memory-management-bound KV cache); p2: design overview.</text>
  <text x="60" y="848" font-size="12" fill="#64748b">§4: VMM-based implementation — cuMem* APIs, on-demand 64 KB physical pages, map / unmap, contiguous virtual reservations.</text>
