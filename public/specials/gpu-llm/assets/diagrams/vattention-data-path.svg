  <rect x="880" y="598" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="944" y="598" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="1008" y="598" width="56" height="56" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
