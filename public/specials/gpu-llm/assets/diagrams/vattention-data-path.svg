<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" role="img" aria-labelledby="vattention-data-path-title vattention-data-path-desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="vattention-data-path-title">vAttention data path: client request to token output over a contiguous virtual KV cache and dynamic 64 KB physical GPU pages</title>
  <desc id="vattention-data-path-desc">Numbered flow: (1) a client sends a generate request to the vLLM server; (2) vLLM's scheduler admits it and the vAttention step reserves KV cache space; (3) vAttention reserves one contiguous, aligned virtual address range for the request's KV cache; (4) CUDA virtual memory management (VMM) maps and unmaps memory via cuMemCreate, cuMemMap, cuMemSetAccess and cuMemUnmap; (5) physical 64 KB GPU pages are allocated on demand, only as the KV cache grows; (6) unmodified attention kernels access GPU memory through the same flat virtual addresses no matter where pages live; (7) the sampled token is streamed back to the client. A side panel contrasts the two views: the virtual layout stays contiguous (adjacent slots V0 to V7), while physical pages are scattered, dynamic 64 KB pages mapped wherever free. A legend explains line and box styles. Sources: vAttention paper, pages 1 and 2, sections 1 and 4.</desc>

  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#ffffff"/>

  <!-- Header -->
  <text x="620" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">vAttention data path — contiguous virtual KV cache on dynamic 64 KB physical pages</text>
  <text x="620" y="64" text-anchor="middle" font-size="13" fill="#475569">How vLLM + vAttention take a client request to token output while physical GPU memory is mapped on demand</text>

  <!-- ============ Left column: numbered pipeline (steps 1-7) ============ -->
  <text x="60" y="114" font-size="13" font-weight="700" fill="#334155">Numbered flow — steps 1 → 7</text>

  <!-- Step 1 -->
  <rect x="60" y="132" width="340" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="87" cy="164" r="16" fill="#1d4ed8"/>
  <text x="87" y="169" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="112" y="153" font-size="14" font-weight="700" fill="#1e3a8a">Client request</text>
  <text x="112" y="171" font-size="12" fill="#334155">prompt arrives at the vLLM API server</text>
  <line x1="230" y1="198" x2="230" y2="224" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 2 -->
  <rect x="60" y="228" width="340" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="87" cy="260" r="16" fill="#1d4ed8"/>
  <text x="87" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="112" y="249" font-size="14" font-weight="700" fill="#1e3a8a">vLLM vAttention step</text>
  <text x="112" y="267" font-size="12" fill="#334155">vLLM scheduler admits the request;</text>
  <text x="112" y="283" font-size="12" fill="#334155">vAttention reserves KV cache space</text>
  <line x1="230" y1="294" x2="230" y2="320" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 3 -->
  <rect x="60" y="324" width="340" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="87" cy="356" r="16" fill="#1d4ed8"/>
  <text x="87" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="112" y="345" font-size="14" font-weight="700" fill="#1e3a8a">Contiguous virtual KV range</text>
  <text x="112" y="363" font-size="12" fill="#334155">per-request KV range in the virtual</text>
  <text x="112" y="379" font-size="12" fill="#334155">address space — contiguous, aligned</text>
  <line x1="230" y1="390" x2="230" y2="416" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 4 -->
  <rect x="60" y="420" width="340" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="87" cy="452" r="16" fill="#1d4ed8"/>
  <text x="87" y="457" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="112" y="441" font-size="14" font-weight="700" fill="#1e3a8a">CUDA VMM map / unmap</text>
  <text x="112" y="459" font-size="12" fill="#334155">map: cuMemCreate + cuMemMap +</text>
  <text x="112" y="475" font-size="12" fill="#334155">cuMemSetAccess; unmap frees (§4)</text>
  <line x1="230" y1="486" x2="230" y2="512" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 5 -->
  <rect x="60" y="516" width="340" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="87" cy="548" r="16" fill="#1d4ed8"/>
  <text x="87" y="553" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="112" y="537" font-size="14" font-weight="700" fill="#1e3a8a">64 KB pages on demand</text>
  <text x="112" y="555" font-size="12" fill="#334155">physical 64 KB GPU pages allocated</text>
  <text x="112" y="571" font-size="12" fill="#334155">only as the KV cache grows</text>
  <line x1="230" y1="582" x2="230" y2="608" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 6 -->
  <rect x="60" y="612" width="340" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="87" cy="644" r="16" fill="#1d4ed8"/>
  <text x="87" y="649" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
  <text x="112" y="633" font-size="14" font-weight="700" fill="#1e3a8a">Attention kernel GPU access</text>
  <text x="112" y="651" font-size="12" fill="#334155">attention kernels unchanged — GPU</text>
  <text x="112" y="667" font-size="12" fill="#334155">access via flat virtual addresses</text>
  <line x1="230" y1="678" x2="230" y2="704" stroke="#334155" stroke-width="2" marker-end="url(#arrowDark)"/>

  <!-- Step 7 -->
  <rect x="60" y="708" width="340" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="87" cy="740" r="16" fill="#1d4ed8"/>
  <text x="87" y="745" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">7</text>
  <text x="112" y="729" font-size="14" font-weight="700" fill="#1e3a8a">Token output</text>
  <text x="112" y="747" font-size="12" fill="#334155">sampled token streams back to the</text>
  <text x="112" y="763" font-size="12" fill="#334155">client; KV grows for the next step</text>

  <!-- ============ Right panel: virtual vs physical memory ============ -->
  <rect x="468" y="96" width="724" height="606" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="126" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">KV memory: virtual layout vs physical allocation (p1–p2, §4)</text>

