  <rect x="816" y="190" width="76" height="52" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
  <rect x="896" y="190" width="76" height="52" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
  <rect x="976" y="190" width="76" height="52" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
  <rect x="1056" y="190" width="76" height="52" fill="#cffafe" stroke="#0891b2" stroke-width="1"/>
  <text x="534" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">V0</text>
  <text x="614" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">V1</text>
  <text x="694" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">V2</text>
  <text x="774" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">V3</text>
  <text x="854" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">V4</text>
  <text x="934" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">V5</text>
  <text x="1014" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">V6</text>
  <text x="1094" y="221" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">V7</text>
  <text x="825" y="274" text-anchor="middle" font-size="12" fill="#0f766e">one flat range: base + i × 64 KB — unmodified attention kernels access it directly (steps 3 · 6)</text>

  <!-- Mapping: dashed VMM map lines virtual -> physical -->
  <line x1="534" y1="244" x2="588" y2="466" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <line x1="614" y1="244" x2="780" y2="466" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <line x1="694" y1="244" x2="972" y2="466" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <line x1="774" y1="244" x2="652" y2="530" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <line x1="854" y1="244" x2="908" y2="530" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <line x1="934" y1="244" x2="524" y2="594" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <line x1="1014" y1="244" x2="780" y2="594" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>
  <line x1="1094" y1="244" x2="1036" y2="594" stroke="#0f766e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowTeal)"/>

  <!-- Step-4 label over the mapping gap -->
  <rect x="575" y="324" width="500" height="52" fill="#f8fafc"/>
  <circle cx="686" cy="340" r="13" fill="#1d4ed8"/>
  <text x="686" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="836" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">step 4 · CUDA VMM map / unmap (§4)</text>
  <text x="825" y="366" text-anchor="middle" font-size="12" fill="#334155">cuMemCreate 64 KB → cuMemMap + cuMemSetAccess · cuMemUnmap frees</text>

  <!-- Physical GPU memory (dynamic, scattered) -->
  <rect x="480" y="430" width="690" height="260" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="496" y="452" font-size="13.5" font-weight="700" fill="#92400e">PHYSICAL — GPU memory: dynamic 64 KB pages, mapped on demand</text>
  <circle cx="1146" cy="447" r="13" fill="#1d4ed8"/>
  <text x="1146" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>

  <!-- Row 0 -->
  <rect x="496" y="470" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="524" y="503" text-anchor="middle" font-size="11" fill="#94a3b8">free</text>
  <rect x="560" y="470" width="56" height="56" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="588" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">V0</text>
  <rect x="624" y="470" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="688" y="470" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="752" y="470" width="56" height="56" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="780" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">V1</text>
  <rect x="816" y="470" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="880" y="470" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="944" y="470" width="56" height="56" fill="#fde68a" stroke="#b45309" stroke-width="1.2"/>
  <text x="972" y="503" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">V2</text>
  <rect x="1008" y="470" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="1072" y="470" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Row 1 -->
  <rect x="496" y="534" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="560" y="534" width="56" height="56" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3 3"/>
