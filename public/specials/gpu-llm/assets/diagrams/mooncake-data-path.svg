<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="mc-svg-title mc-svg-desc" lang="zh-CN" xml:lang="zh-CN" font-family="'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title id="mc-svg-title">Mooncake 数据通路（按序流程）：客户端 → 调度器/控制器 → 预填充 → KV 传输 fabric → 解码 → Tokens</title>
  <desc id="mc-svg-desc">按序编号的数据通路图，共 6 步：第 1 步，客户端发出请求；第 2 步，调度器/控制器进行调度；第 3 步，预填充（Prefill）实例处理提示并产出 KV 缓存；第 4 步，KV 传输 fabric 在实例之间传输 KV 缓存；第 5 步，解码（Decode）实例进行增量解码；第 6 步，生成 Tokens。图中仅绘制上述主流程，用实线箭头表示按序数据通路。补充说明：状态逐出（eviction）为可配置项，图中不绘制固定的逐出路径；状态到 SSD 的传输方式未指明，图中不绘制该路径；800 Gbps 互联带宽仅适用于 A800 测试平台；图中不包含直连显存（direct-VRAM）、重试、故障或待处理页等其他路径。</desc>

  <defs>
    <marker id="mc-m-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="320" fill="#ffffff"/>

  <text x="20" y="32" font-size="17" font-weight="bold" fill="#111111">Mooncake 数据通路（按序流程）</text>

  <!-- 第 1 步：客户端 -->
  <g>
    <rect x="20" y="56" width="120" height="84" rx="10" fill="#e6f4ea" stroke="#1e7b34" stroke-width="1.5"/>
    <circle cx="38" cy="74" r="12" fill="#1e7b34"/>
    <text x="38" y="78.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">1</text>
    <text x="80" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#10233f">客户端</text>
    <text x="80" y="127" text-anchor="middle" font-size="11" fill="#45566e">Client</text>
  </g>

  <!-- 第 2 步：调度器/控制器 -->
  <g>
    <rect x="180" y="56" width="120" height="84" rx="10" fill="#e8f1ff" stroke="#2b5fab" stroke-width="1.5"/>
    <circle cx="198" cy="74" r="12" fill="#2b5fab"/>
    <text x="198" y="78.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">2</text>
    <text x="240" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#10233f">调度器/控制器</text>
    <text x="240" y="119" text-anchor="middle" font-size="10.5" fill="#45566e">Scheduler /</text>
    <text x="240" y="133" text-anchor="middle" font-size="10.5" fill="#45566e">Controller</text>
  </g>

  <!-- 第 3 步：预填充 -->
  <g>
    <rect x="340" y="56" width="120" height="84" rx="10" fill="#e8f1ff" stroke="#2b5fab" stroke-width="1.5"/>
    <circle cx="358" cy="74" r="12" fill="#2b5fab"/>
    <text x="358" y="78.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">3</text>
    <text x="400" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#10233f">预填充</text>
    <text x="400" y="127" text-anchor="middle" font-size="11" fill="#45566e">Prefill</text>
  </g>

  <!-- 第 4 步：KV 传输 fabric -->
  <g>
    <rect x="500" y="56" width="120" height="84" rx="10" fill="#e8f1ff" stroke="#2b5fab" stroke-width="1.5"/>
    <circle cx="518" cy="74" r="12" fill="#2b5fab"/>
    <text x="518" y="78.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">4</text>
    <text x="560" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#10233f">KV 传输 fabric</text>
    <text x="560" y="127" text-anchor="middle" font-size="10.5" fill="#45566e">KV Transfer Fabric</text>
  </g>

  <!-- 第 5 步：解码 -->
  <g>
    <rect x="660" y="56" width="120" height="84" rx="10" fill="#e8f1ff" stroke="#2b5fab" stroke-width="1.5"/>
    <circle cx="678" cy="74" r="12" fill="#2b5fab"/>
    <text x="678" y="78.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">5</text>
    <text x="720" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#10233f">解码</text>
    <text x="720" y="127" text-anchor="middle" font-size="11" fill="#45566e">Decode</text>
  </g>

  <!-- 第 6 步：Tokens -->
  <g>
    <rect x="820" y="56" width="120" height="84" rx="10" fill="#e6f4ea" stroke="#1e7b34" stroke-width="1.5"/>
    <circle cx="838" cy="74" r="12" fill="#1e7b34"/>
    <text x="838" y="78.5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">6</text>
    <text x="880" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#10233f">输出 Tokens</text>
    <text x="880" y="127" text-anchor="middle" font-size="11" fill="#45566e">Tokens</text>
  </g>

  <!-- 按序数据通路箭头：1 → 2 → 3 → 4 → 5 → 6 -->
  <g stroke="#333333" stroke-width="2">
    <line x1="146" y1="98" x2="170" y2="98" marker-end="url(#mc-m-data)"/>
    <line x1="306" y1="98" x2="330" y2="98" marker-end="url(#mc-m-data)"/>
    <line x1="466" y1="98" x2="490" y2="98" marker-end="url(#mc-m-data)"/>
    <line x1="626" y1="98" x2="650" y2="98" marker-end="url(#mc-m-data)"/>
    <line x1="786" y1="98" x2="810" y2="98" marker-end="url(#mc-m-data)"/>
  </g>

  <!-- 图例与说明 -->
  <g>
    <rect x="20" y="168" width="920" height="124" rx="8" fill="#fafafa" stroke="#cccccc"/>
    <text x="36" y="192" font-size="13" font-weight="bold" fill="#111111">图例与说明</text>
    <line x1="36" y1="214" x2="78" y2="214" stroke="#333333" stroke-width="2" marker-end="url(#mc-m-data)"/>
    <text x="90" y="218" font-size="12.5" fill="#333333">实线箭头：按序主数据通路（步骤 1 → 6）</text>
    <text x="90" y="242" font-size="12.5" fill="#555555">注 1：状态逐出（eviction）为可配置项，图中不绘制固定的逐出路径。</text>
    <text x="90" y="262" font-size="12.5" fill="#555555">注 2：状态到 SSD 的传输方式未指明，图中不绘制该路径。</text>
    <text x="90" y="282" font-size="12.5" fill="#555555">注 3：800 Gbps 互联带宽仅适用于 A800 测试平台，不代表其他部署配置。</text>
  </g>
</svg>
