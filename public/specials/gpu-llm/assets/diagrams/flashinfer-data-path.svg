<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1630" width="1000" height="1630" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="fi-dp-title fi-dp-desc" font-family="'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei','WenQuanYi Zen Hei',system-ui,sans-serif">
  <title id="fi-dp-title">FlashInfer 推理注意力数据路径图（request/context 到 logits/tokens）</title>
  <desc id="fi-dp-desc">自上而下十个阶段：1 请求/上下文：prompt 与已生成 token 构成请求，各请求查询打包为 ragged 无填充张量（P，p.4 §3.1.1）。2 服务运行时：SGLang、vLLM、MLC-Engine 已集成，通过 AttentionWrapper(变体规格, 任务信息, workspace) 使用，运行时输入为序列长度信息（P，p.1-2、p.7-8 §3.4）。3 Attention State 选择：规范 kernel 输出为 output 与 LSE，配可结合/交换的组合算子，据此选择 split-KV 分块与共享前缀分解（P，p.3 §2.2）。4 BSR/可组合 KV-Cache：非连续页表布局统一为块稀疏行 BSR 矩阵，可组合格式只计算 index/indptr、不搬运 KV 数据（P，p.4-5 §3.1 加 Fig.2/Fig.3）。5 Attention 模板与变体仿函数：FA2（sm75-89）与 FA3（Hopper sm90a）CUDA/CUTLASS 模板，Query/Key/Value/Output/LogitsTransform 与 LogitsMask 仿函数可融合 RoPE、归一化、掩码（P，p.5-6 §3.2 加 Fig.5）。6 JIT 编译与缓存：按变体规格生成优化 kernel，经 PyTorch JIT 编译并注册为自定义算子，init 时编译、缓存复用（P，p.6 §3.2.3、p.7-8 §3.4）。7 负载均衡 plan：CPU 每步执行，按代价模型分派工作队列，生成约简映射与 workspace 偏移，计划跨层复用，不被 CUDAGraph 捕获（P，p.7 Alg.1、§3.3.1/§3.4）。8 CUDAGraph 兼容静态缓冲：workspace 按最大容量分配、段偏移固定，plan 信息经 cudaMemcpyAsync 从锁页主机缓冲异步下发，短请求可直写输出（P，p.7 §3.3.1、p.19 App.D）。9 GPU attention kernel/TMA：attention 与 split-KV 约简合并为单一持久 kernel，grid 编译期固定；分散 KV 块经 128B LDGSTS 汇聚至共享内存，TMA 仅用于 Hopper 连续 KV-Cache（P，p.5 §3.2.1、p.19 App.D）。10 logits/tokens：规范输出 Attention State 写回 ragged 输出张量，交回运行时采样（P，p.3 §2.2；端到端闭环为编辑推断 I）。实线箭头为数据流（请求、Q/KV、部分输出、logits），虚线箭头为控制流（规格、JIT 产物、调度、图捕获）；P 表示论文事实并附页码/章节，I 表示编辑推断；本图不含性能数字。来源：arXiv:2501.01005v2（MLSys 2025）。</desc>

  <defs>
    <marker id="fi-dp-arr-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1e40af"/>
    </marker>
    <marker id="fi-dp-arr-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="fi-dp-arr-kv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/>
    </marker>
  </defs>

  <!-- ======== 可见标题区 ======== -->
  <text x="60" y="38" font-size="18" font-weight="700" fill="#12274a">FlashInfer 注意力数据路径图</text>
  <text x="60" y="60" font-size="12" fill="#334155">自上而下阅读；实线箭头=数据流，虚线箭头=控制流；图例与来源见底部</text>
  <text x="940" y="38" text-anchor="end" font-size="12" fill="#334155">无性能数字 · P=论文事实 · I=编辑推断</text>

