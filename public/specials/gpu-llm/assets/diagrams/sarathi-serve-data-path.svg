<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 800" role="img" aria-labelledby="ss-svg-title ss-svg-desc" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
  <title id="ss-svg-title">Sarathi-Serve 数据路径图：客户端、API 前端、stall-free 调度器（控制面）、token 预算约束下的 decode+prefill 块混合批、GPU 前向引擎、HBM 中的权重与 KV cache，以及 TP/PP 通信</title>
  <desc id="ss-svg-desc">流程图，展示 Sarathi-Serve 单副本端到端数据路径。① 客户端请求发送到 vLLM 风格的 API 前端并入队。② 迭代级调度器（控制面，虚线框）按论文算法3 构造下一次迭代：先打包全部运行中请求的 decode token，再续算未完成的 prefill 块，最后在剩余额度内接纳新请求。③ 每次迭代的混合批由 D 个 decode token 加 1 个 prefill 块组成，批内 token 总数不超过由 TBT SLO 推导的 token 预算（论文评测取 strict 512、relaxed 2048），因此每迭代计算量近均匀。④ 混合批进入 GPU 前向引擎逐层计算：线性层 GEMM 与注意力 kernel（FlashAttention v2 / FlashInfer，paged chunk prefill）。⑤ 线性层从 HBM 读取模型权重；注意力经 PagedAttention 页表读写 KV cache，prefill 块产出新 KV 追加，跨块注意力需重读先前块的 KV。⑥ TP/PP 通信经 NCCL：TP 每层两次 all-reduce（节点内 NVLink），PP 在 stage 间点对点传激活（跨节点 100 Gbps 以太网），近均匀微批使流水线气泡最小。⑦ 采样产出的 token 流式送回 API 前端。⑧ token 流式返回客户端，首个 token 到达时间即 TTFT。图例区分控制面、计算、存储/内存、网络与关键数字依据；虚线框为控制面，虚线箭头为跨块 KV 重读。</desc>

  <defs>
    <marker id="ss-m-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="ss-m-mem" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6d28d9"/>
    </marker>
    <marker id="ss-m-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="ss-m-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="800" fill="#ffffff"/>

  <text x="540" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#16213e">Sarathi-Serve 数据路径：客户端 → 调度 → 混合批 → GPU / HBM → 通信（arXiv 2403.02310）</text>
  <text x="540" y="52" text-anchor="middle" font-size="12" fill="#475569">实线 = 数据路径；虚线框/虚线箭头 = 控制流或重读路径；编号 ①–⑧ 对应页面正文文字序列</text>

  <g>
    <rect x="20" y="66" width="1040" height="44" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="40" y="78" width="26" height="20" fill="none" stroke="#475569" stroke-dasharray="5 3"/>
    <text x="74" y="93" font-size="13" fill="#16213e">控制面（虚线）</text>
    <rect x="250" y="78" width="26" height="20" fill="#e0f2fe" stroke="#0e7490"/>
    <text x="284" y="93" font-size="13" fill="#16213e">计算 / GPU</text>
    <rect x="420" y="78" width="26" height="20" fill="#ede9fe" stroke="#6d28d9"/>
    <text x="454" y="93" font-size="13" fill="#16213e">存储 / 内存</text>
    <rect x="600" y="78" width="26" height="20" fill="#ffedd5" stroke="#c2410c"/>
    <text x="634" y="93" font-size="13" fill="#16213e">网络</text>
    <rect x="740" y="78" width="26" height="20" fill="#fffbeb" stroke="#b45309"/>
    <text x="774" y="93" font-size="13" fill="#16213e">关键数字依据</text>
    <text x="916" y="93" font-size="11" fill="#475569">颜色仅辅助，均有文字</text>
  </g>

  <!-- ① 客户端 -->
  <rect x="30" y="140" width="150" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="105" y="166" text-anchor="middle" font-size="14" font-weight="bold" fill="#16213e">客户端</text>
  <text x="105" y="186" text-anchor="middle" font-size="11" fill="#475569">请求 / 流式响应</text>

  <!-- API 前端 -->
  <rect x="230" y="140" width="180" height="64" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#16213e">API 前端（vLLM 服务）</text>
  <text x="320" y="186" text-anchor="middle" font-size="11" fill="#475569">请求队列 · 遥测</text>

  <!-- ① 客户端 -> API -->
  <line x1="180" y1="164" x2="228" y2="164" stroke="#334155" stroke-width="1.5" marker-end="url(#ss-m-data)"/>
  <text x="204" y="156" text-anchor="middle" font-size="11" fill="#334155">① 请求</text>
  <!-- ⑧ API -> 客户端 -->
  <line x1="228" y1="192" x2="184" y2="192" stroke="#334155" stroke-width="1.5" marker-end="url(#ss-m-data)"/>
  <text x="206" y="208" text-anchor="middle" font-size="11" fill="#334155">⑧ token 流</text>

  <!-- ② API -> 调度器 -->
  <line x1="410" y1="160" x2="458" y2="160" stroke="#334155" stroke-width="1.5" marker-end="url(#ss-m-data)"/>
  <text x="434" y="152" text-anchor="middle" font-size="11" fill="#334155">②</text>

  <!-- 调度器（控制面，虚线） -->
  <rect x="460" y="118" width="400" height="112" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="660" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">调度器 · Stall-free Batching（控制面）</text>
  <text x="660" y="162" text-anchor="middle" font-size="11" fill="#16213e">每迭代顺序：先打包全部运行中 decode → 续算未完成 prefill 块</text>
  <text x="660" y="180" text-anchor="middle" font-size="11" fill="#16213e">→ 在剩余额度内接纳新请求（论文第 9 页算法 3）</text>
  <text x="660" y="199" text-anchor="middle" font-size="11" fill="#16213e">token budget = f(TBT SLO)：评测取 strict 512 / relaxed 2048（第 11 页 §5.1）</text>
  <text x="660" y="217" text-anchor="middle" font-size="10" font-style="italic" fill="#92400e">预算可经 Vidur 仿真器离线选定（论文第 9 页 §4.3）</text>

  <!-- ③ 调度器 -> 混合批 -->
  <line x1="660" y1="232" x2="660" y2="258" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ss-m-ctrl)"/>
  <text x="670" y="249" font-size="11" fill="#b45309">③ 迭代编排（控制）</text>

  <!-- 混合批 -->
  <rect x="460" y="262" width="400" height="80" rx="6" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.5"/>
  <text x="660" y="286" text-anchor="middle" font-size="13" font-weight="bold" fill="#16213e">混合批 · 单次迭代（数据面）</text>
  <text x="660" y="306" text-anchor="middle" font-size="11" fill="#16213e">D 个 decode token（各请求 1 个）+ 1 个 prefill 块</text>
  <text x="660" y="324" text-anchor="middle" font-size="11" fill="#16213e">批内 token 总数 ≤ token budget → 每迭代计算量近均匀</text>

  <!-- ④ 混合批 -> GPU -->
  <line x1="660" y1="344" x2="660" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#ss-m-data)"/>
  <text x="670" y="361" font-size="11" fill="#334155">④ 提交执行</text>

  <!-- GPU 前向引擎 -->
  <rect x="460" y="374" width="400" height="140" rx="8" fill="#f0f9ff" stroke="#0e7490" stroke-width="1.5"/>
  <text x="660" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#0e7490">GPU 前向引擎（逐层执行 ×层数）</text>
  <text x="660" y="418" text-anchor="middle" font-size="11" fill="#16213e">线性层 GEMM：批越大越摊薄权重读取</text>
  <text x="660" y="436" text-anchor="middle" font-size="11" fill="#16213e">注意力 kernel：FlashAttention v2 / FlashInfer · paged chunk prefill</text>
  <text x="660" y="454" text-anchor="middle" font-size="11" fill="#16213e">跨块注意力需重读同 prompt 先前块的 KV</text>
  <text x="660" y="472" text-anchor="middle" font-size="11" fill="#16213e">采样器：decode 请求产出新 token，prefill 请求续算下一块</text>
  <text x="660" y="498" text-anchor="middle" font-size="10" font-style="italic" fill="#475569">论文实现基于 vLLM + FlashAttention v2 / FlashInfer（§4.4）</text>

  <!-- TP/PP 通信 -->
  <rect x="890" y="374" width="160" height="140" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="970" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">TP / PP 通信</text>
  <text x="970" y="418" text-anchor="middle" font-size="10" fill="#16213e">TP：每层 2 次 all-reduce</text>
  <text x="970" y="436" text-anchor="middle" font-size="10" fill="#16213e">（节点内 NVLink）</text>
  <text x="970" y="454" text-anchor="middle" font-size="10" fill="#16213e">PP：stage 间激活点对点</text>
  <text x="970" y="472" text-anchor="middle" font-size="10" fill="#16213e">跨节点 100 Gbps 以太网</text>
  <text x="970" y="492" text-anchor="middle" font-size="10" font-style="italic" fill="#9a3412">近均匀微批 → 气泡最小</text>

  <!-- ⑥ GPU <-> 通信 -->
  <line x1="862" y1="410" x2="888" y2="410" stroke="#c2410c" stroke-width="1.5" marker-start="url(#ss-m-net)" marker-end="url(#ss-m-net)"/>
  <line x1="862" y1="470" x2="888" y2="470" stroke="#c2410c" stroke-width="1.5" marker-start="url(#ss-m-net)" marker-end="url(#ss-m-net)"/>
  <text x="875" y="398" text-anchor="middle" font-size="11" fill="#c2410c">⑥</text>

  <!-- HBM -->
  <rect x="460" y="548" width="400" height="120" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="660" y="572" text-anchor="middle" font-size="13" font-weight="bold" fill="#16213e">GPU HBM 显存（存储 / 内存）</text>
  <text x="660" y="592" text-anchor="middle" font-size="11" fill="#16213e">模型权重（只读，按批摊薄读取成本）</text>
  <text x="660" y="610" text-anchor="middle" font-size="11" fill="#16213e">KV cache 页表（PagedAttention 分页管理）</text>
  <text x="660" y="628" text-anchor="middle" font-size="11" fill="#16213e">prefill 块追加新 KV；decode 读写全部历史 KV</text>

  <!-- ⑤ 权重 / KV 读写 -->
  <line x1="560" y1="516" x2="560" y2="546" stroke="#6d28d9" stroke-width="1.5" marker-end="url(#ss-m-mem)"/>
  <text x="552" y="536" text-anchor="end" font-size="11" fill="#6d28d9">⑤ 权重读取</text>
  <line x1="640" y1="516" x2="640" y2="546" stroke="#6d28d9" stroke-width="1.5" marker-start="url(#ss-m-mem)" marker-end="url(#ss-m-mem)"/>
  <text x="648" y="536" font-size="11" fill="#6d28d9">⑤ KV 读/写</text>
  <!-- 跨块 KV 重读（虚线，风险路径） -->
  <line x1="740" y1="546" x2="740" y2="516" stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ss-m-ctrl)"/>
  <text x="748" y="536" font-size="10" fill="#92400e">跨块重读（N−i 次）</text>

  <!-- ⑦ GPU -> API（token 返回） -->
  <path d="M 458 484 L 432 484 L 432 188 L 414 188" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#ss-m-data)"/>
  <text x="424" y="330" text-anchor="end" font-size="11" fill="#334155">⑦ 新 token</text>
  <text x="424" y="346" text-anchor="end" font-size="11" fill="#334155">（流式）</text>

  <!-- 关键数字依据 -->
  <rect x="30" y="560" width="380" height="108" rx="6" fill="#fffbeb" stroke="#b45309"/>
  <text x="46" y="584" font-size="12" font-weight="bold" fill="#92400e">论文量化依据（P）</text>
  <text x="46" y="604" font-size="10.5" fill="#16213e">朴素混合批：TBT 最高恶化 28.3×（图9）</text>
  <text x="46" y="622" font-size="10.5" fill="#16213e">chunk 257 vs 256：prefill 时间 +32%（tile 量化）</text>
  <text x="46" y="640" font-size="10.5" fill="#16213e">chunk 512 开销 ≤ 约 25%，2048 近乎为零（图14）</text>
  <text x="46" y="658" font-size="10.5" fill="#16213e">Falcon-180B：4k prefill ≈1150ms vs decode-32 ≈200ms</text>

  <text x="540" y="748" text-anchor="middle" font-size="11" fill="#475569">来源：arXiv 2403.02310v3（本地 PDF 02_Sarathi-Serve_2403.02310.pdf）。调度顺序对应论文算法 3；token budget 512/2048 为论文评测取值；</text>
  <text x="540" y="766" text-anchor="middle" font-size="11" fill="#475569">TP/PP 通信与硬件参数见论文 §2.3、§4.4、§5（表1）。最后核验日期：2026-09-13。</text>
</svg>
